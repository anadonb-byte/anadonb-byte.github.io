bio: |-
  I am an experimental physicist and a Ramón y Cajal Fellow at the Instituto de Nanociencia y Materiales de Aragón (INMA), a joint institute of CSIC and the Universidad de Zaragoza. My research sits at the interface of **spintronics**, **ultrafast magnetism** and **3D nanomagnetism**: how spin and heat currents are generated and controlled in nanoscale magnetic materials, and how they can be used to write and move magnetic information.

  I did my PhD in Zaragoza on the spin Seebeck effect. I then worked as a postdoctoral researcher at IMDEA Nanociencia in Madrid, on spin–orbitronics in graphene-based heterostructures, and at the Institut Jean Lamour in Nancy, on picosecond spin–orbit torques. Between 2024 and 2026 I led the Marie Skłodowska-Curie project **3D-Sky** at INMA, in collaboration with Amalio Fernández-Pacheco's group at TU Wien. Since July 2026 I continue this line as a Ramón y Cajal Fellow.

