<!doctype html>
<html lang="en-GB">
<head>
{{ partial "head.html" . }}
</head>
<body id="top" class="{{ block "bodyClass" . }}{{ end }}">
<a class="skip-link" href="#main">Skip to content</a>
{{ partial "header.html" . }}
<main id="main">
{{ block "main" . }}{{ end }}
</main>
{{ partial "footer.html" . }}
{{- $js := resources.Get "js/main.js" | minify | fingerprint }}
<script src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>
</body>
</html>
