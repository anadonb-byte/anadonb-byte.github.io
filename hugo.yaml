baseURL: "https://anadonb-byte.github.io/"
locale: "en-GB"
title: "Alberto Anadón Barcelona"
timeZone: "Europe/Madrid"
enableRobotsTXT: true

# El contenido de la portada vive en data/*.yaml; las noticias en content/blogs/.
outputs:
  home: ["HTML", "RSS"]
  section: ["HTML", "RSS"]
  page: ["HTML"]
  taxonomy: ["HTML"]
  term: ["HTML"]

taxonomies:
  tag: "tags"

pagination:
  pagerSize: 12

markup:
  goldmark:
    renderer:
      unsafe: true   # necesario para el <video> incrustado en las noticias
    parser:
      wrapStandAloneImageWithinParagraph: false

menus:
  main:
    - name: "Research"
      url: "/#research"
      weight: 10
    - name: "Publications"
      url: "/#publications"
      weight: 20
    - name: "News"
      pageRef: "/blogs"
      weight: 30
    - name: "About"
      url: "/#about"
      weight: 40
    - name: "Join"
      url: "/#join"
      weight: 50

params:
  description: "Alberto Anadón Barcelona, Ramón y Cajal Fellow at INMA (CSIC – Universidad de Zaragoza). Spintronics, ultrafast magnetism and 3D nanomagnetism."
  ogImage: "/images/site/og-default.jpg"
  mainSections: ["blogs"]
  dateFormat: "2 January 2006"
